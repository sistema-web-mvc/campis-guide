
<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Campi's Guide</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #123e68, #0878d1, #35a7e8);
            overflow: hidden;
            position: relative;
        }

        /* ELEMENTOS DECORATIVOS */

        body::before {
            content: "";
            position: absolute;
            width: 450px;
            height: 450px;
            background: rgba(255,255,255,0.08);
            border-radius: 50%;
            top: -150px;
            left: -120px;
        }

        body::after {
            content: "";
            position: absolute;
            width: 400px;
            height: 400px;
            background: rgba(255,255,255,0.08);
            border-radius: 50%;
            bottom: -180px;
            right: -100px;
        }

        /* CONTAINER */

        .container {
            width: 420px;
            max-width: 90%;
            background: white;
            padding: 45px 40px;
            border-radius: 22px;
            box-shadow: 0 15px 45px rgba(0,0,0,0.2);
            position: relative;
            z-index: 1;
            animation: aparecer 0.7s ease;
        }

        @keyframes aparecer {
            from {
                opacity: 0;
                transform: translateY(25px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* LOGO */

        .logo {
            text-align: center;
            font-size: 29px;
            font-weight: bold;
            color: #174b75;
            margin-bottom: 30px;
        }

        .logo span {
            color: #35a7a0;
        }

        /* ÍCONE */

        .icone-login {
            width: 95px;
            height: 95px;
            border: 3px solid #0878d1;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 22px;
            font-size: 42px;
            color: #0878d1;
        }

        /* TÍTULO */

        h1 {
            color: #174b75;
            text-align: center;
            font-size: 30px;
            margin-bottom: 10px;
        }

        .subtitulo {
            text-align: center;
            color: #718096;
            font-size: 15px;
            margin-bottom: 35px;
        }

        /* CAMPOS */

        .campo {
            margin-bottom: 22px;
        }

        .campo label {
            display: block;
            color: #174b75;
            font-weight: bold;
            margin-bottom: 9px;
        }

        .campo input {
            width: 100%;
            padding: 15px;
            border: 1.5px solid #d5dce5;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
            transition: 0.3s;
            color: #174b75;
        }

        .campo input:focus {
            border-color: #0878d1;
            box-shadow: 0 0 0 3px rgba(8,120,209,0.1);
        }

        .campo input::placeholder {
            color: #a0aec0;
        }

        /* SENHA */

        .senha-container {
            position: relative;
        }

        .senha-container input {
            padding-right: 48px;
        }

        .mostrar-senha {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 19px;
            color: #718096;
        }

        /* ESQUECI SENHA */

        .esqueci {
            display: block;
            text-align: right;
            margin-top: -10px;
            margin-bottom: 25px;
            color: #0878d1;
            text-decoration: none;
            font-size: 14px;
        }

        .esqueci:hover {
            text-decoration: underline;
        }

        /* BOTÃO ENTRAR */

        .btn-entrar {
            width: 100%;
            padding: 16px;
            background: linear-gradient(90deg, #0865d8, #0878d1);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-entrar:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(8,120,209,0.3);
        }

        /* DIVISOR */

        .divisor {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #a0aec0;
            margin: 25px 0;
        }

        .divisor::before,
        .divisor::after {
            content: "";
            height: 1px;
            background: #dce2e9;
            flex: 1;
        }

        /* CRIAR CONTA */

        .btn-criar {
            display: block;
            width: 100%;
            padding: 14px;
            border: 1.5px solid #0878d1;
            border-radius: 10px;
            text-align: center;
            text-decoration: none;
            color: #0878d1;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-criar:hover {
            background: #0878d1;
            color: white;
        }

        /* RODAPÉ */

        .rodape {
            text-align: center;
            color: #a0aec0;
            font-size: 12px;
            margin-top: 28px;
        }

        /* RESPONSIVIDADE */

        @media (max-width: 480px) {
            .container {
                padding: 35px 25px;
            }

            h1 {
                font-size: 25px;
            }

            .logo {
                font-size: 25px;
            }
        }

    </style>
</head>

<body>

    <div class="container">

        <div class="logo">
            Campi's <span>Guide</span>
        </div>

        <p th:if="${mensagem}" th:text="${mensagem}"
           style="color: #16803c; text-align: center; margin-bottom: 15px;"></p>

        <div class="icone-login">
            🔒
        </div>

        <h1>Bem-vindo!</h1>

        <p class="subtitulo">
            Faça login para acessar sua conta
        </p>

        <form th:action="@{/login}" method="POST" id="formLogin">

    <div class="campo">
        <label for="email">E-mail</label>
        <input
            type="email"
            id="email"
            name="email"
            placeholder="Digite seu e-mail"
            required
        >
    </div>

    <div class="campo">
        <label for="senha">Senha</label>

        <div class="senha-container">
            <input
                type="password"
                id="senha"
                name="senha"
                placeholder="Digite sua senha"
                required
            >

            <span class="mostrar-senha"
                  onclick="mostrarSenha()"
                  id="olho">👁</span>
        </div>
    </div>

    <p th:if="${erro}" th:text="${erro}"
       style="color: red; margin-bottom: 15px;">
    </p>

    <button type="submit" class="btn-entrar">
        Entrar
    </button>

</form>

        <div class="divisor">
            ou
        </div>

        <a th:href="@{/estudantes/novo}" class="btn-criar">
            Criar conta
        </a>

        <p class="rodape">
            © 2026 Campi's Guide - Todos os direitos reservados
        </p>

    </div>

    <script>

        // MOSTRAR E OCULTAR SENHA

        function mostrarSenha() {

            const senha = document.getElementById("senha");
            const olho = document.getElementById("olho");

            if (senha.type === "password") {

                senha.type = "text";
                olho.innerText = "🙈";

            } else {

                senha.type = "password";
                olho.innerText = "👁";

            }

        }

    </script>

</body>
</html>
