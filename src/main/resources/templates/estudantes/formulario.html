
<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cadastro de Estudante - Campus Guide</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div th:replace="~{fragments/header :: cabecalho}"></div>

<div class="container mt-5">

    <div class="card shadow mx-auto" style="max-width: 650px;">
        <div class="card-header text-white" style="background-color: #174b75;">
            <h4 class="mb-0"
                th:text="${estudante.id == null ? 'Cadastrar estudante' : 'Editar estudante'}">
            </h4>
        </div>

        <div class="card-body">

            <form th:action="@{/estudantes/salvar}"
                  th:object="${estudante}"
                  method="post">

                <input type="hidden" th:field="*{id}">

                <div class="mb-3">
                    <label class="form-label">Nome</label>
                    <input type="text" class="form-control"
                           th:field="*{nome}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Matrícula</label>
                    <input type="text" class="form-control"
                           th:field="*{matricula}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">E-mail</label>
                    <input type="email" class="form-control"
                           th:field="*{email}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Senha</label>
                    <input type="password" class="form-control"
                           th:field="*{senha}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Curso</label>
                    <input type="text" class="form-control"
                           th:field="*{curso}" required>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn text-white"
                            style="background-color: #174b75;">
                        Salvar
                    </button>

                    <a th:href="@{/estudantes}" class="btn btn-secondary">
                        Cancelar
                    </a>
                </div>

            </form>

        </div>
    </div>

</div>

<div th:replace="~{fragments/footer :: rodape}"></div>

</body>
</html>
