
<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Estudantes - Campus Guide</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div th:replace="~{fragments/header :: cabecalho}"></div>

<div class="container mt-5">

    <h2 class="mb-4" style="color: #174b75;">
        Estudantes cadastrados
    </h2>

    <div th:if="${mensagem}" class="alert alert-success"
         th:text="${mensagem}"></div>

    <div th:if="${erro}" class="alert alert-danger"
         th:text="${erro}"></div>

    <div class="d-flex justify-content-between mb-3">

        <form th:action="@{/estudantes}" method="get" class="d-flex gap-2">
            <input type="text" name="busca" class="form-control"
                   placeholder="Buscar estudante..."
                   th:value="${busca}">

            <button type="submit" class="btn btn-primary">Buscar</button>
        </form>

        <a th:href="@{/estudantes/novo}" class="btn btn-success">
            + Novo estudante
        </a>

    </div>

    <div class="card shadow">
        <div class="table-responsive">

            <table class="table table-hover mb-0">

                <thead style="background-color: #174b75; color: white;">
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>Matrícula</th>
                        <th>E-mail</th>
                        <th>Curso</th>
                        <th>Ações</th>
                    </tr>
                </thead>

                <tbody>

                    <tr th:each="estudante : ${estudantes}">
                        <td th:text="${estudante.id}"></td>
                        <td th:text="${estudante.nome}"></td>
                        <td th:text="${estudante.matricula}"></td>
                        <td th:text="${estudante.email}"></td>
                        <td th:text="${estudante.curso}"></td>

                        <td>
                            <a th:href="@{/estudantes/editar/{id}(id=${estudante.id})}"
                               class="btn btn-warning btn-sm">
                                Editar
                            </a>

                            <form th:action="@{/estudantes/excluir/{id}(id=${estudante.id})}"
                                  method="post" class="d-inline"
                                  onsubmit="return confirm('Deseja realmente excluir este estudante?')">

                                <button type="submit" class="btn btn-danger btn-sm">
                                    Excluir
                                </button>

                            </form>
                        </td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(estudantes)}">
                        <td colspan="6" class="text-center p-4">
                            Nenhum estudante encontrado.
                        </td>
                    </tr>

                </tbody>
            </table>

        </div>
    </div>

</div>

<div th:replace="~{fragments/footer :: rodape}"></div>

</body>
</html>
