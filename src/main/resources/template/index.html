<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Campus Guide</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f5f9;
            overflow: hidden;
        }

        /* CABEÇALHO */

        header {
            height: 75px;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 35px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            color: #174b75;
        }

        .logo span {
            color: #35a7a0;
        }

        /* ÍCONES LATERAIS */

        .atalhos {
            position: fixed;
            top: 100px;
            right: 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 10;
        }

        .atalho {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 12px;
            cursor: pointer;
        }

        .atalho p {
            opacity: 0;
            transform: translateX(10px);
            transition: 0.3s;
            color: #174b75;
            font-weight: bold;
            background: white;
            padding: 9px 13px;
            border-radius: 8px;
            pointer-events: none;
        }

        .atalho:hover p {
            opacity: 1;
            transform: translateX(0);
        }

        .icone {
            width: 52px;
            height: 52px;
            background: #174b75;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 25px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.2);
            transition: 0.3s;
        }

        .atalho:hover .icone {
            background: #35a7a0;
            transform: scale(1.08);
        }

        /* ÁREA PRINCIPAL */

        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 25px 20px;
        }

        .titulo {
            color: #174b75;
            margin-bottom: 18px;
            font-size: 22px;
        }

        /* BOTÕES 2D E 3D */

        .visualizacao {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .visualizacao button {
            padding: 9px 25px;
            border: none;
            border-radius: 8px;
            background: white;
            color: #174b75;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            transition: 0.3s;
        }

        .visualizacao button.ativo {
            background: #174b75;
            color: white;
        }

        /* MAPA */

        .area-mapa {
            width: 85%;
            height: 490px;
            background: white;
            border-radius: 15px;
            overflow: hidden;
            position: relative;
            cursor: grab;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            touch-action: none;
        }

        .area-mapa:active {
            cursor: grabbing;
        }

        #mapa {
            position: absolute;
            left: 0;
            top: 0;
            transform-origin: center;
            transition: transform 0.2s;
            user-select: none;
            -webkit-user-drag: none;
        }

        #mapa img {
            width: 1000px;
            max-width: none;
            display: block;
            pointer-events: none;
            user-select: none;
        }

        /* VISUALIZAÇÃO 3D PROVISÓRIA */

        #mapa.visao3d {
            transform: perspective(1000px) rotateX(15deg) scale(0.85);
        }

        /* BOTÃO QR CODE */

        .botao-qrcode {
            margin-top: 20px;
            padding: 14px 30px;
            background: #35a7a0;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .botao-qrcode:hover {
            background: #25847f;
            transform: scale(1.04);
        }

        /* CÂMERA */

        #leitor {
            display: none;
            margin-top: 15px;
            width: 320px;
        }

        #leitor video {
            width: 100%;
            border-radius: 10px;
        }

        #resultado {
            margin-top: 10px;
            color: #174b75;
            font-weight: bold;
        }

        /* RESPONSIVIDADE */

        @media (max-width: 768px) {

            header {
                padding: 0 15px;
            }

            .area-mapa {
                width: 100%;
                height: 55vh;
            }

            .atalhos {
                right: 12px;
            }

            .icone {
                width: 45px;
                height: 45px;
            }

            main {
                padding: 20px 10px;
            }
        }

    </style>
</head>

<body>

    <header>
        <div class="logo">Campus <span>Guide</span></div>
    </header>

    <!-- ATALHOS -->

    <div class="atalhos">

        <div class="atalho" onclick="encontrarAmigos()">
            <p>Encontrar amigos</p>
            <div class="icone">♙</div>
        </div>

        <div class="atalho" onclick="encontrarSala()">
            <p>Encontrar sala</p>
            <div class="icone">✥</div>
        </div>

    </div>

    <main>

        <h2 class="titulo">Explore seu campus</h2>

        <!-- VISUALIZAÇÃO -->

        <div class="visualizacao">

            <button id="btn2D" class="ativo" onclick="mudarVisualizacao(2)">
                2D
            </button>

            <button id="btn3D" onclick="mudarVisualizacao(3)">
                3D
            </button>

        </div>

        <!-- MAPA -->

        <div class="area-mapa" id="areaMapa">

            <div id="mapa">

                <iframe src="https://planner5d.com/editor?s=&source=editor_share&source_platform=project_from_web&source_entity=project&source_entity_id=c36ca9f061eb32d8e3468ce647b15e2c&granted_role=viewer&invitation_method=copy&invitation_resolved=1&key=c36ca9f061eb32d8e3468ce647b15e2c" style="width:960px;height:500px;border:none;" allowfullscreen></iframe>

            </div>

        </div>

        <!-- QR CODE -->

        <button class="botao-qrcode" onclick="abrirCamera()">
            📷 Voce está aqui<br><span style="font-size: 10px">Escanear QR Code</span>
        </button>

        <div id="leitor"></div>

        <p id="resultado"></p>

    </main>

    <!-- JAVASCRIPT -->

    <script src="https://unpkg.com/html5-qrcode"></script>

    <script>

        // MAPA INTERATIVO

        const mapa = document.getElementById("mapa");
        const areaMapa = document.getElementById("areaMapa");

        let posX = 0;
        let posY = 0;
        let inicioX = 0;
        let inicioY = 0;
        let arrastando = false;
        let zoom = 1;

        function atualizarMapa() {

            mapa.style.transform =
                `translate(${posX}px, ${posY}px) scale(${zoom})`;

        }

        areaMapa.addEventListener("pointerdown", function(e) {

            arrastando = true;

            inicioX = e.clientX - posX;
            inicioY = e.clientY - posY;

            areaMapa.setPointerCapture(e.pointerId);

        });

        areaMapa.addEventListener("pointermove", function(e) {

            if (!arrastando) return;

            posX = e.clientX - inicioX;
            posY = e.clientY - inicioY;

            atualizarMapa();

        });

        function pararArrasto() {
            arrastando = false;
        }

        areaMapa.addEventListener("pointerup", pararArrasto);
        areaMapa.addEventListener("pointercancel", pararArrasto);

        // ZOOM

        areaMapa.addEventListener("wheel", function(e) {

            e.preventDefault();

            zoom += e.deltaY < 0 ? 0.1 : -0.1;

            if (zoom < 0.5) zoom = 0.5;
            if (zoom > 3) zoom = 3;

            atualizarMapa();

        }, { passive: false });


        // VISUALIZAÇÃO 2D E 3D

        function mudarVisualizacao(tipo) {

            const btn2D = document.getElementById("btn2D");
            const btn3D = document.getElementById("btn3D");

            if (tipo === 2) {

                mapa.classList.remove("visao3d");

                btn2D.classList.add("ativo");
                btn3D.classList.remove("ativo");

            } else {

                mapa.classList.add("visao3d");

                btn3D.classList.add("ativo");
                btn2D.classList.remove("ativo");

            }

        }


        // ENCONTRAR AMIGOS

        function encontrarAmigos() {

            alert("Funcionalidade de encontrar amigos!");

        }


        // ENCONTRAR SALA

        function encontrarSala() {

            alert("Funcionalidade de encontrar sala!");

        }


        // LEITOR DE QR CODE

        let leitor = null;

        async function abrirCamera() {

            const elemento = document.getElementById("leitor");
            const resultado = document.getElementById("resultado");

            elemento.style.display = "block";

            if (leitor !== null) return;

            leitor = new Html5Qrcode("leitor");

            try {

                await leitor.start(
                    { facingMode: "environment" },
                    { fps: 10, qrbox: 250 },

                    async function(codigo) {

                        resultado.innerText =
                            "QR Code identificado: " + codigo;

                        await leitor.stop();
                        leitor.clear();
                        leitor = null;

                    },

                    function() {}

                );

            } catch (erro) {

                resultado.innerText =
                    "Não foi possível acessar a câmera.";

                leitor = null;

            }

        }

    </script>

</body>
</html>
