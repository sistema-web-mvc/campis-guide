
<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Estudantes - Campus Guide</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f2f5f9;
            color: #333;
        }

        header {
            background-color: #174b75;
            color: white;
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 24px;
        }

        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .titulo {
            margin-bottom: 25px;
        }

        .titulo h2 {
            color: #174b75;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .titulo p {
            color: #777;
        }

        .busca {
            background-color: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px #00000010;
            margin-bottom: 25px;
        }

        .busca form {
            display: flex;
            gap: 10px;
        }

        .busca input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
        }

        .busca input:focus {
            border-color: #35a7a0;
        }

        button {
            background-color: #174b75;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: #35a7a0;
        }

        .tabela-container {
            background-color: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 2px 8px #00000010;
            overflow-x: auto;
        }

        .tabela-container h3 {
            color: #174b75;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background-color: #174b75;
            color: white;
            padding: 15px;
            text-align: left;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #eee;
        }

        tbody tr:hover {
            background-color: #f2f8fa;
        }

        .vazio {
            text-align: center;
            color: #888;
            padding: 25px;
        }

        footer {
            background-color: #174b75;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 50px;
        }
    </style>
</head>
<body>

    <h1>Estudantes cadastrados</h1>

    <form th:action="@{/estudantes}" method="get">
        <input type="text" name="busca"
               placeholder="Buscar estudante..."
               th:value="${busca}">

        <button type="submit">Buscar</button>
    </form>

    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Matrícula</th>
                <th>E-mail</th>
                <th>Curso</th>
            </tr>
        </thead>

        <tbody>
            <tr th:each="estudante : ${estudantes}">
                <td th:text="${estudante.id}"></td>
                <td th:text="${estudante.nome}"></td>
                <td th:text="${estudante.matricula}"></td>
                <td th:text="${estudante.email}"></td>
                <td th:text="${estudante.curso}"></td>
            </tr>
        </tbody>
    </table>

    <p th:if="${#lists.isEmpty(estudantes)}">
        Nenhum estudante encontrado.
    </p>

</body>
</html>
