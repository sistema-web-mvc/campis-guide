
<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Estudantes - Campus Guide</title>
</head>
<body>

    <h1>Estudantes cadastrados</h1>

    <form th:action="@{/estudantes}" method="get">
        <input type="text" name="busca"
               placeholder="Buscar estudante..."
               th:value="${busca}">

        <button type="submit">Buscar</button>
    </form>

    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Matrícula</th>
                <th>E-mail</th>
                <th>Curso</th>
            </tr>
        </thead>

        <tbody>
            <tr th:each="estudante : ${estudantes}">
                <td th:text="${estudante.id}"></td>
                <td th:text="${estudante.nome}"></td>
                <td th:text="${estudante.matricula}"></td>
                <td th:text="${estudante.email}"></td>
                <td th:text="${estudante.curso}"></td>
            </tr>
        </tbody>
    </table>

    <p th:if="${#lists.isEmpty(estudantes)}">
        Nenhum estudante encontrado.
    </p>

</body>
</html>
